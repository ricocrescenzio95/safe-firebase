name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift Package Tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Start Firestore Emulator
        run: |
          firebase emulators:start --only firestore --project demo-safe-firebase > /tmp/firestore-emulator.log 2>&1 &
          echo $! > /tmp/firestore-emulator.pid

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8080 > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Firestore Emulator failed to start:"
              cat /tmp/firestore-emulator.log
              exit 1
            fi

            sleep 1
          done

      - name: Run Tests
        run: swift test --parallel

      - name: Stop Firestore Emulator
        if: always()
        run: |
          if [ -f /tmp/firestore-emulator.pid ]; then
            kill "$(cat /tmp/firestore-emulator.pid)" || true
          fi

          if [ -f /tmp/firestore-emulator.log ]; then
            cat /tmp/firestore-emulator.log
          fi
